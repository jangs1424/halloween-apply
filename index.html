<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>기기괴담 · 참가 신청</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#111018;color:#f7f3eb}main{width:100%;max-width:480px;padding:48px 32px;border:1px solid #37313d;border-radius:24px;background:#19161f;text-align:center}.tag{color:#ffb66f;font-size:12px;letter-spacing:.18em;font-weight:700}.symbol{font-size:52px;margin:28px 0 18px}h1{font-size:clamp(25px,6vw,34px);letter-spacing:-.05em;margin:0 0 18px;line-height:1.3}p{color:#c9c1ce;line-height:1.8;font-size:16px;margin:0;word-break:keep-all}a,button{display:inline-block;margin-top:28px;padding:15px 24px;background:#ffb66f;color:#20130a;border:0;border-radius:12px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}[hidden]{display:none!important}.footer{margin-top:32px;font-size:12px;color:#938a9b}
</style>
</head>
<body>
<main>
<div class="tag">기기괴담 : 동아리 실종사건</div>
<div class="symbol" aria-hidden="true">✦</div>
<div role="status" aria-live="polite"><h1 id="title">10월 13일 오후 7시<br>신청 오픈</h1><p id="message">2026년 10월 13일(화) 오후 7시 · 한국시간<br>회차별 16명 선착순으로 조기 마감될 수 있습니다.</p></div>
<p id="countdown" style="margin-top:24px;color:#ffb66f;font-weight:700"></p>
<p style="margin-top:24px;font-size:14px">미성년자 포함, 참가자 1명당 신청서 1건을 제출해 주세요.<br>사전 방문으로 대기 순번이 부여되지는 않습니다.<br>접수는 오픈 후 신청서 제출 순서로 진행됩니다.</p>
<a id="apply" hidden rel="noopener">신청폼 열기</a>
<button id="retry" hidden type="button" onclick="location.reload()">다시 확인하기</button>
<noscript><p>신청 안내를 보려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
<div class="footer">기기괴담 · 참가 신청</div>
</main>
<script>
(async () => {
 const title=document.getElementById('title');
 const message=document.getElementById('message');
 const apply=document.getElementById('apply');
 const retry=document.getElementById('retry');
 const countdown=document.getElementById('countdown');
 try {
  const response=await fetch('./config.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('Configuration unavailable');
  const config=await response.json();
  const opensAt=Date.parse(config.opensAt);
  if(!Number.isFinite(opensAt) || typeof config.destinationUrl!=='string') throw new Error('Invalid configuration');
  let destination=null;
  if(config.destinationUrl.trim()) {
   destination=new URL(config.destinationUrl.trim());
   if(destination.protocol!=='https:' || destination.username || destination.password || destination.origin===location.origin) throw new Error('Invalid destination');
  }
  let timer;
  const render=()=>{
   const remaining=opensAt-Date.now();
   if(remaining>0) {
    const seconds=Math.ceil(remaining/1000);
    countdown.textContent=`오픈까지 ${Math.floor(seconds/86400)}일 ${Math.floor(seconds%86400/3600)}시간 ${Math.floor(seconds%3600/60)}분 ${seconds%60}초`;
    return;
   }
   clearInterval(timer);
   countdown.textContent='';
   if(!destination) {
    title.textContent='신청 연결을 준비하고 있습니다';
    message.textContent='신청서 연결을 확인 중입니다. 잠시 후 다시 확인해 주세요.';
    retry.hidden=false;
    return;
   }
   title.textContent='기기괴담 참가 신청';
   message.textContent='신청이 시작되었습니다. 회차별 16명 선착순으로 조기 마감될 수 있습니다.';
   apply.href=destination.href;
   apply.hidden=false;
  };
  timer=setInterval(render,1000);
  render();
 } catch(error) {
  countdown.textContent='';
  message.textContent='신청은 2026년 10월 13일 오후 7시(한국시간)에 오픈합니다. 현재 연결 상태를 확인할 수 없습니다. 잠시 후 다시 확인해 주세요.';
  retry.hidden=false;
 }
})();
</script>
</body>
</html>
